# Target Python 3.12 (ROS 2 Jazzy)
target-version = "py312"
line-length = 100

exclude = [
    ".git",
    "build",
    "install",
    "log",
    "**/build/**",
    "**/install/**",
    "**/log/**",
    "**/.egg-info/**",
    "**/__pycache__/**",
    # Crucial: upstream/ contains vendored Python 2/3 legacy academic code from aislabunimi/ROSE2
    "**/upstream/**",
]

src = [
    "src/oomwoo_cleaning_jobs_core",
    "src/oomwoo_cleaning_jobs_ui",
    "src/oomwoo_rose2",
    "src/oomwoo_segmentation",
]

[lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "UP",
    "B",
    "C4",
]
ignore = [
    "E501",
    "B008",
]

[lint.isort]
known-first-party = [
    "oomwoo_cleaning_jobs_core",
    "oomwoo_cleaning_jobs_ui",
    "oomwoo_rose2",
    "oomwoo_segmentation",
    "oomwoo_segmentation_interfaces",
]

[format]
quote-style = "preserve"
indent-style = "space"
